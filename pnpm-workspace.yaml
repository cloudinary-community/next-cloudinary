packages:
  - docs
  - next-cloudinary
patchedDependencies:
  # Works around a semantic-release/npm bug: `publish.js` runs `npm publish <pkgRoot>`
  # with cwd left at the repo root instead of <pkgRoot>. That mismatch has been reported
  # to cause various publish-time failures (wrong version read, 403s, etc.) - in our case
  # it looked like an npm Trusted Publishers (OIDC) auth failure. Documented upstream,
  # never merged:
  #   Bug:          https://github.com/semantic-release/npm/issues/504
  #   Unmerged fix: https://github.com/semantic-release/npm/pull/531
  #
  # We also suspected a second issue (verifyConditions burning the run's one npm OIDC
  # token-exchange, leaving nothing for the real `npm publish` to use) and patched
  # around it too, but pulled that part back out deliberately - it was our own
  # diagnosis, not a documented upstream issue, and we'd rather confirm it's actually
  # needed (via verbose npm logging - see NPM_CONFIG_LOGLEVEL in the release workflow)
  # before patching more of this package than necessary. If it turns out to be real,
  # look for prior art on it before re-patching.
  #
  # Once a released @semantic-release/npm version includes an equivalent fix for the
  # cwd/basePath bug (check whether ENEEDAUTH still reproduces without this patch before
  # assuming so), do all of:
  #   1. Bump the "@semantic-release/npm" version in package.json to that release.
  #   2. Delete this patchedDependencies entry and patches/@semantic-release__npm@13.1.5.patch.
  #   3. Run `pnpm install`.
  # Step 1 without steps 2-3 will make `pnpm install` fail outright (pnpm errors if a
  # patchedDependencies entry doesn't match an installed version) - that failure is the
  # signal to finish the cleanup, not a sign anything else is wrong.
  '@semantic-release/npm@13.1.5': patches/@semantic-release__npm@13.1.5.patch
